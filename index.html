<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>French Semantic Guess Game - Multiplayer</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { margin-bottom: 10px; }
        #log { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #ccc; margin-top: 10px; padding: 5px; }
        #log li { margin-bottom: 4px; }
        .progress-container { width: 100px; background: #eee; height: 10px; border-radius: 5px; }
        .progress-bar { height: 10px; background: #4caf50; border-radius: 5px; }
        table td {
            padding: 0 10px; /* 10px left and right padding */
            white-space: pre;
            text-align: right;
            font-family: monospace;
        }
    </style>
</head>
<body>

<h2>Cémantix (oui oui, le vrai)</h2>

<div>
    Pseudo: <input id="username" placeholder="Pseudo" />
</div>
<div>
    Joueurs en ligne: <span id="peer-count">0</span>
    <ul id="peer-list"></ul>
</div>

<p id="hint">Chagement...</p>

<input id="guess" placeholder="Enter a word">
<button id="compute">Confirmer</button>

<p>Guess récents</p>
<table id="recentGuessTable">
    <tbody></tbody>
</table>

<p>Tous les guess</p>
<table id="guessTable">
    <tbody></tbody>
</table>

</br>
<ul id="log"></ul>

<button id="newWord">Nouveau mot</button>

<script type="module" src="js/app.js"></script>
</body>
</html>
