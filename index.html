<!DOCTYPE html>
<html>
<head>

    <title>French Semantic Guess Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>

        <tbody></tbody>
    </table>

</html>
